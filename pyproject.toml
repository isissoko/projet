[project]
name = "sigaps"
version = "0.1.0"
description = "Gestion, validation et archivage des productions académiques"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*", "bin", "staticfiles"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "DJ", "SIM", "C4", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "RUF012"]  # apostrophes françaises, attributs Meta Django

[tool.ruff.lint.isort]
known-first-party = ["config", "comptes", "referentiel"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "--strict-markers -ra"
testpaths = ["comptes", "referentiel", "tests"]

[tool.coverage.run]
source = ["."]
omit = ["*/migrations/*", "*/tests/*", "tests/*", "config/*", "manage.py", ".venv/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
