services:
  db:
    image: postgres:17.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sigaps}
      POSTGRES_USER: ${POSTGRES_USER:-sigaps}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sigaps}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - sigaps_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sigaps_pgdata:
